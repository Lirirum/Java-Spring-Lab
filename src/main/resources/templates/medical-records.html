<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Medical Records</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{layouts/main :: navbar}"></div>
    <div class="main">
        <div class="content">
            <h2>Medical Records</h2>
            <a href="/medical-records/add" class="btn">Add New Record</a>
            <table class="styled-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient ID</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${records}">
                    <td th:text="${record.id}"></td>
                    <td th:text="${record.patient.fullName}"></td>
                    <td th:text="${record.description}"></td>
                    <td th:text="${record.createdAt}"></td>
                    <td>
                        <a th:href="@{/medical-records/edit/{id}(id=${record.id})}" class="btn">Edit</a>
                        <a th:href="@{/medical-records/delete/{id}(id=${record.id})}" class="btn delete">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{layouts/main :: footer}"></div>
</div>
</body>
</html>
